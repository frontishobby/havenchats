<!doctype html>
<html lang="ko">

		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0b0b12" />
		<!-- 소설 모드 채팅 본문용 한글 세리프(명조). SIL OFL, 상업적 사용 자유. -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap"
			rel="stylesheet"
		/>
		<!--
			부트 스켈레톤: SPA(ssr=false)라 JS 번들 다운로드 + 페이지 load(/api/*) 가 끝날 때까지
			아무것도 렌더되지 않는다 → 그 사이 경로별 뼈대를 먼저 보여준다. app.css 보다 먼저
			그려져야 하므로 스타일은 여기 인라인(토큰 값은 app.css 와 동일). 루트 +layout.svelte 가
			마운트되면 #boot 를 페이드아웃 후 제거한다.
		-->
		<style>
			#boot {
				position: fixed;
				inset: 0;
				z-index: 50;
				overflow: hidden;
				background: #0b0b12;
				color: #ececf1;
				font-family:
					'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', system-ui,
					sans-serif;
				pointer-events: none;
				transition: opacity 0.16s ease;
			}
			#boot.out {
				opacity: 0;
			}
			#boot [data-page] {
				display: none;
			}
			#boot[data-v='home'] [data-page='home'],
			#boot[data-v='chat'] [data-page='chat'],
			#boot[data-v='styles'] [data-page='styles'],
			#boot[data-v='user'] [data-page='user'],
			#boot[data-v='form'] [data-page='form'],
			#boot[data-v='misc'] [data-page='misc'] {
				display: block;
			}
			/* 공통 블록(은은한 shimmer) */
			#boot .sk {
				background: #181826;
				border-radius: 8px;
				position: relative;
				overflow: hidden;
			}
			#boot .sk::after {
				content: '';
				position: absolute;
				inset: 0;
				background: linear-gradient(
					90deg,
					transparent 0%,
					rgba(255, 255, 255, 0.035) 50%,
					transparent 100%
				);
				transform: translateX(-100%);
				animation: boot-shimmer 1.4s ease-in-out infinite;
			}
			@keyframes boot-shimmer {
				to {
					transform: translateX(100%);
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#boot .sk::after {
					animation: none;
				}
			}
			#boot .pill {
				border-radius: 999px;
			}
			#boot .circle {
				border-radius: 50%;
			}
			#boot .line {
				height: 12px;
			}
			/* 상단바(레이아웃 .topbar 와 동일 치수: 60px, 좌 브랜드 / 우 링크+버튼) */
			#boot .top {
				height: 60px;
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 0 20px;
				border-bottom: 1px solid #2a2a3c;
			}
			#boot .brand {
				display: flex;
				align-items: center;
				gap: 8px;
				font-weight: 800;
				font-size: 1.15rem;
				letter-spacing: -0.01em;
			}
			#boot .brand .logo {
				color: #7c5cff;
				font-size: 1.3rem;
			}
			#boot .brand .dim {
				color: #6b6b80;
				font-weight: 600;
			}
			#boot .top-right {
				display: flex;
				align-items: center;
				gap: 16px;
			}
			#boot .wrap {
				max-width: 1180px;
				margin: 0 auto;
				padding: 0 20px;
			}
			/* 홈: 검색 pill + 태그 chip + 카드 그리드 */
			#boot .hero {
				padding: 32px 0 24px;
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 20px;
			}
			#boot .search {
				width: 100%;
				max-width: 520px;
				height: 46px;
			}
			#boot .chips {
				display: flex;
				flex-wrap: wrap;
				gap: 8px;
				justify-content: center;
			}
			#boot .chip {
				height: 30px;
				width: 64px;
			}
			#boot .grid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
				gap: 18px;
				padding: 16px 0 64px;
			}
			#boot .grid.small {
				grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
			}
			#boot .card {
				border-radius: 16px;
				border: 1px solid #2a2a3c;
				background: #181826;
				overflow: hidden;
			}
			#boot .card .thumb {
				aspect-ratio: 1 / 1;
				border-radius: 0;
				background: #1f1f30;
			}
			#boot .card .body {
				padding: 12px 14px 14px;
				display: flex;
				flex-direction: column;
				gap: 8px;
			}
			#boot .card .body .sk {
				background: #23233a;
			}
			/* 모바일 채팅 화면: 레이아웃이 상단 네비바를 숨기므로 스켈레톤도 동일하게. */
			@media (max-width: 640px) {
				#boot[data-v='chat'] .top {
					display: none;
				}
			}
			@media (max-width: 640px) {
				#boot .grid,
				#boot .grid.small {
					grid-template-columns: repeat(2, 1fr);
					gap: 12px;
				}
				#boot .card:nth-child(n + 7) {
					display: none;
				}
			}
			/* 채팅: 캐릭터 헤더 + 산문 줄 + 입력창 (ChatView .chat 과 동일 폭/높이) */
			#boot .chat {
				height: calc(100vh - 60px);
				height: calc(100dvh - 60px);
				max-width: 760px;
				margin: 0 auto;
				display: flex;
				flex-direction: column;
			}
			#boot .chat-head {
				display: flex;
				align-items: center;
				gap: 12px;
				padding: 12px 16px;
				border-bottom: 1px solid #2a2a3c;
			}
			#boot .chat-head .back {
				color: #6b6b80;
				font-size: 1.1rem;
				width: 24px;
				text-align: center;
			}
			#boot .chat-head .who {
				display: flex;
				flex-direction: column;
				gap: 7px;
			}
			#boot .thread {
				flex: 1;
				padding: 28px 20px;
				display: flex;
				flex-direction: column;
				gap: 12px;
			}
			#boot .thread .gap {
				height: 14px;
			}
			#boot .composer {
				padding: 12px 16px 16px;
				border-top: 1px solid #2a2a3c;
			}
			#boot .composer .box {
				height: 48px;
				border-radius: 24px;
				border: 1px solid #2a2a3c;
			}
			/* 프로필: 아바타 + 이름/소개 */
			#boot .profile {
				display: flex;
				align-items: center;
				gap: 20px;
				padding: 32px 0 8px;
			}
			#boot .profile .info {
				display: flex;
				flex-direction: column;
				gap: 10px;
			}
			/* 폼: 라벨 + 입력 블록 */
			#boot .form {
				max-width: 760px;
				margin: 0 auto;
				padding: 32px 20px;
				display: flex;
				flex-direction: column;
				gap: 22px;
			}
			#boot .field {
				display: flex;
				flex-direction: column;
				gap: 8px;
			}
			#boot .input {
				height: 44px;
				border-radius: 10px;
			}
			#boot .input.tall {
				height: 160px;
			}
			/* 기타(관리자 등): 제목 + 행 */
			#boot .rows {
				padding: 32px 0;
				display: flex;
				flex-direction: column;
				gap: 12px;
			}
			#boot .row {
				height: 52px;
				border-radius: 12px;
			}
		</style>
		%sveltekit.head%
	</head>

					<div class="card"><div class="sk thumb"></div><div class="body"><div class="sk line" style="width: 60%; height: 14px"></div><div class="sk line" style="width: 50%"></div></div></div>

		<script>
			// 경로 → 스켈레톤 변형 선택(SvelteKit 라우트 구조와 맞춤). JS 실행 전엔 상단바만 보인다.
			(function () {
				var p = location.pathname;
				var v = 'misc';
				if (p === '/' || p === '/index.html') v = 'home';
				else if (p.indexOf('/chat/') === 0) v = 'chat';
				else if (p === '/styles' || p.indexOf('/styles/') === 0 || p === '/modules') v = 'styles';
				else if (p.indexOf('/user/') === 0) v = 'user';
				else if (p === '/create' || p === '/import' || /^\/characters\/[^/]+\/(edit|assets)/.test(p))
					v = 'form';
				var boot = document.getElementById('boot');
				boot.setAttribute('data-v', v);
				// 안전망: 앱이 끝내 마운트되지 않아도(번들 실패 등) 화면을 영구히 덮지 않는다.
				setTimeout(function () {
					if (boot.parentNode) boot.remove();
				}, 15000);
			})();
		</script>
		<div style="display: contents">%sveltekit.body%</div>
